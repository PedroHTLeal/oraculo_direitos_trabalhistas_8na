# Integração contínua (PB19): a cada envio ao GitHub, roda os testes do backend
# e confere o frontend. Não usa chaves: banco, IA e e-mail são simulados nos testes.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt pytest==8.3.4
      - name: Rodar os testes
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Verificar o código (ESLint)
        working-directory: frontend
        run: npm run lint
      - name: Compilar
        working-directory: frontend
        run: npm run build
