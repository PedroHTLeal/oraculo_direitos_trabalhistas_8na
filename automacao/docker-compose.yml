# Automação do WhatsApp do Oráculo: n8n + Evolution API, rodando no seu computador (grátis).
#
#   n8n            (http://localhost:5678)          recebe os pedidos do Oráculo e executa o fluxo
#   Evolution API  (http://localhost:8080/manager)  conecta um WhatsApp por QR code e envia as mensagens
#   PostgreSQL     (interno)                        banco de dados usado pela Evolution API
#
# Os valores ${...} vêm do arquivo automacao/.env (criado pelo iniciar-automacao.bat).
# Para subir: iniciar-automacao.bat (ou "docker compose up -d" nesta pasta).

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: oraculo-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # O fluxo lê estas variáveis: token do Oráculo, chave e instância da Evolution API
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - ORACULO_TOKEN=${ORACULO_TOKEN}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCIA=oraculo
    volumes:
      - n8n_dados:/home/node/.n8n
    depends_on:
      - evolution-api

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: oraculo-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - LANGUAGE=pt-BR
      - DEL_INSTANCE=false
      # Banco de dados (contêiner "postgres" abaixo)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${POSTGRES_SENHA}@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=oraculo
      # Sem Redis: o cache fica na memória (suficiente para o Oráculo)
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      # Se o QR code não aparecer, preencha com a versão atual do WhatsApp Web (ver docs/configuracao.md)
      - CONFIG_SESSION_PHONE_VERSION=${WHATSAPP_WEB_VERSAO:-}
    volumes:
      # Guarda a conexão do WhatsApp: não é preciso ler o QR code de novo a cada vez
      - evolution_instancias:/evolution/instances
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: oraculo-evolution-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${POSTGRES_SENHA}
      - POSTGRES_DB=evolution
    volumes:
      - evolution_banco:/var/lib/postgresql/data

volumes:
  n8n_dados:
  evolution_instancias:
  evolution_banco:
