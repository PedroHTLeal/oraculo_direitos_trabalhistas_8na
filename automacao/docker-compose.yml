# Automação do WhatsApp do Oráculo: n8n + WAHA, rodando no seu computador (grátis).
#
#   n8n  (http://localhost:5678)            recebe os pedidos do Oráculo e executa o fluxo
#   WAHA (http://localhost:3000/dashboard)  conecta um WhatsApp por QR code e envia as mensagens
#
# Os valores ${...} vêm do arquivo automacao/.env (copie de .env.example).
# Para subir: iniciar-automacao.bat (ou "docker compose up -d" nesta pasta).

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: oraculo-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # O fluxo lê o token do Oráculo e a chave do WAHA destas variáveis
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - ORACULO_TOKEN=${ORACULO_TOKEN}
      - WAHA_API_KEY=${WAHA_API_KEY}
    volumes:
      - n8n_dados:/home/node/.n8n
    depends_on:
      - waha

  waha:
    image: devlikeapro/waha:latest
    container_name: oraculo-waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=America/Sao_Paulo
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=${WAHA_SENHA_PAINEL}
      - WHATSAPP_SWAGGER_USERNAME=admin
      - WHATSAPP_SWAGGER_PASSWORD=${WAHA_SENHA_PAINEL}
    volumes:
      # Guarda a conexão do WhatsApp: não é preciso ler o QR code de novo a cada vez
      - waha_sessoes:/app/.sessions

volumes:
  n8n_dados:
  waha_sessoes:
